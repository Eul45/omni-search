name: Build Installers

on:
  push:
    paths:
      - 'android/**'
      - 'src/**'
      - 'src-tauri/**'
      - 'public/**'
      - 'index.html'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - 'vite.config.ts'
      - '.github/workflows/main.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64
            runner: windows-latest
            arch: x86_64
            args: ''
            bundle-path: src-tauri/target/release/bundle
            artifact-name: installer-x64

          - name: arm64
            runner: windows-11-arm
            arch: aarch64
            args: '--bundles nsis'
            bundle-path: src-tauri/target/release/bundle
            artifact-name: installer-arm64

    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.runner }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: 'npm'

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build Tauri App
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: ${{ matrix.args }}

      - name: Build OmniSearch Lite
        if: matrix.arch == 'x86_64'
        shell: bash
        run: |
          cargo build --manifest-path omnisearch-lite/Cargo.toml --release
          iscc omnisearch-lite/installer.iss
          mkdir -p src-tauri/target/release/bundle/nsis
          cp omnisearch-lite/setup/omnisearchlitesetup.exe src-tauri/target/release/bundle/nsis/

      - name: Upload MSI Artifact
        if: matrix.arch == 'x86_64'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-msi
          path: ${{ matrix.bundle-path }}/msi/*.msi

      - name: Upload NSIS Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact-name }}-nsis
          path: ${{ matrix.bundle-path }}/nsis/*.exe

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      HAS_ANDROID_SIGNING_KEY: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Make Gradle wrapper executable
        working-directory: android
        run: chmod +x ./gradlew

      - name: Disable noisy Java/Kotlin problem matcher
        run: |
          echo "::remove-matcher owner=java::"
          echo "::remove-matcher owner=javac::"
          echo "::remove-matcher owner=kotlin::"
          echo "::remove-matcher owner=java-kotlin::"

      - name: Validate Android signing secrets
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        shell: bash
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          test -n "$ANDROID_KEY_PASSWORD"

      - name: Decode Android signing key
        if: env.HAS_ANDROID_SIGNING_KEY == 'true'
        shell: bash
        run: |
          mkdir -p android/app/signing
          printf '%s' "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 --decode > android/app/signing/omnisearch-upload.jks

      - name: Build release APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_PATH: ${{ github.workspace }}/android/app/signing/omnisearch-upload.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Rename APK
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/release/app-release.apk release-assets/OmniSearch-Android.apk

      - name: Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: omnisearch-android-preview-apk
          path: release-assets/OmniSearch-Android.apk
          if-no-files-found: error
