name: SignPath Production Signing

on:
  workflow_dispatch:

jobs:
  sign-production-installer:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x64-nsis
            runner: windows-latest
            args: '--bundles nsis'
            bundle_type: 'nsis'
            config_slug: 'nsis-installer'
            file_ext: '*.exe'

          - name: arm64-nsis
            runner: windows-11-arm
            args: '--bundles nsis'
            bundle_type: 'nsis'
            config_slug: 'nsis-installer'
            file_ext: '*.exe'

          - name: x64-msi
            runner: windows-latest
            args: '--bundles msi'
            bundle_type: 'msi'
            config_slug: 'msi-installer'
            file_ext: '*.msi'

          - name: x64-lite
            runner: windows-latest
            args: ''
            bundle_type: 'lite'
            config_slug: 'nsis-installer'
            file_ext: 'omnisearchlitesetup.exe'

    name: Sign ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Install dependencies
        run: npm install

      - name: Build installer
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if ("${{ matrix.name }}" -eq "x64-lite") {
            cargo build --manifest-path omnisearch-lite/Cargo.toml --release
            iscc omnisearch-lite/installer.iss
            New-Item -ItemType Directory -Force -Path "src-tauri/target/release/bundle/lite"
            Copy-Item -Path "omnisearch-lite/setup/omnisearchlitesetup.exe" -Destination "src-tauri/target/release/bundle/lite/omnisearchlitesetup.exe"
          } else {
            npx tauri build ${{ matrix.args }}
          }

      - name: Locate unsigned installer
        id: locate-installer
        shell: pwsh
        run: |
          $installer = Get-ChildItem -Path "src-tauri/target/release/bundle/${{ matrix.bundle_type }}/${{ matrix.file_ext }}" | Select-Object -First 1
          if (-not $installer) {
            throw "Installer not found."
          }
          "installer_path=$($installer.FullName)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload unsigned installer for SignPath
        id: upload-unsigned-artifact
        uses: actions/upload-artifact@v7
        with:
          path: ${{ steps.locate-installer.outputs.installer_path }}
          archive: false

      - name: Submit production signing request to SignPath
        id: signpath
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: "520bf315-b8ba-44fe-84c1-32c3a40c2f9f"
          project-slug: "omni-search"
          signing-policy-slug: "release-signing"
          artifact-configuration-slug: ${{ matrix.config_slug }}
          github-artifact-id: ${{ steps.upload-unsigned-artifact.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: "${{ github.workspace }}\\signed-artifacts"
          skip-decompress: true

      - name: Sign updater package
        if: matrix.bundle_type == 'nsis' || matrix.bundle_type == 'msi'
        shell: pwsh
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          $installer = Get-ChildItem -Path "signed-artifacts/${{ matrix.file_ext }}" | Select-Object -First 1
          if (-not $installer) {
            throw "Signed installer not found."
          }
          $signature = npx tauri signer sign "$($installer.FullName)"
          if ($LASTEXITCODE -ne 0) {
            throw "Tauri updater signature failed."
          }
          Set-Content -Path "$($installer.FullName).sig" -Value $signature.Trim() -Encoding utf8

      - name: Get version from tauri.conf.json
        id: get-version
        shell: pwsh
        run: |
          $version = (Get-Content src-tauri/tauri.conf.json | ConvertFrom-Json).version
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append

      - name: Upload signed installer to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          draft: true
          prerelease: false
          files: signed-artifacts/${{ matrix.file_ext }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload updater signature to GitHub Release
        if: matrix.bundle_type == 'nsis' || matrix.bundle_type == 'msi'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          draft: true
          prerelease: false
          files: signed-artifacts/${{ matrix.file_ext }}.sig
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload signed installer as artifact
        uses: actions/upload-artifact@v7
        with:
          name: signed-${{ matrix.name }}
          path: signed-artifacts
          if-no-files-found: error

      - name: Write SignPath summary
        shell: pwsh
        run: |
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "## SignPath Production Signing (${{ matrix.name }})"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value ""
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Signing request: ${{ steps.signpath.outputs.signing-request-web-url }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Signed artifact download: ${{ steps.signpath.outputs.signed-artifact-download-url }}"
          Add-Content -Path $env:GITHUB_STEP_SUMMARY -Value "- Note: release-signing requests require manual approval in the SignPath UI before the workflow can finish."

  publish-updater-manifest:
    name: Publish Updater Manifest
    runs-on: ubuntu-latest
    needs: sign-production-installer
    permissions:
      contents: write
      actions: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download signed release artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: signed-*
          path: signed-release-assets

      - name: Get version from tauri.conf.json
        id: get-version
        shell: bash
        run: |
          VERSION="$(python -c "import json; print(json.load(open('src-tauri/tauri.conf.json'))['version'])")"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        shell: bash
        run: |
          if [ -s RELEASE_NOTES.md ]; then
            cp RELEASE_NOTES.md release-notes.md
          else
            {
              echo "Changes in this OmniSearch update:"
              echo
              git log -20 --pretty=format:"- %s" || echo "- OmniSearch update."
            } > release-notes.md
          fi

      - name: Generate updater manifest from signed installers
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          VERSION: ${{ steps.get-version.outputs.version }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          assets_dir = Path("signed-release-assets")
          repo = os.environ["REPOSITORY"]
          version = os.environ["VERSION"]
          notes = Path("release-notes.md").read_text(encoding="utf-8").strip()
          platforms = {}

          for sig_path in sorted(assets_dir.rglob("*.exe.sig")):
              installer = Path(str(sig_path)[:-4])
              if not installer.exists():
                  continue
              context = " ".join(part.lower() for part in sig_path.parts)
              if "arm64" in context or "aarch64" in context:
                  platform = "windows-aarch64-nsis"
              elif "x64" in context or "x86_64" in context:
                  platform = "windows-x86_64-nsis"
              else:
                  continue
              platforms[platform] = {
                  "signature": sig_path.read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{repo}/releases/latest/download/{installer.name}",
              }

          for sig_path in sorted(assets_dir.rglob("*.msi.sig")):
              installer = Path(str(sig_path)[:-4])
              if not installer.exists():
                  continue
              context = " ".join(part.lower() for part in sig_path.parts)
              if "arm64" in context or "aarch64" in context:
                  platform = "windows-aarch64-msi"
              elif "x64" in context or "x86_64" in context:
                  platform = "windows-x86_64-msi"
              else:
                  continue
              platforms[platform] = {
                  "signature": sig_path.read_text(encoding="utf-8").strip(),
                  "url": f"https://github.com/{repo}/releases/latest/download/{installer.name}",
              }

          missing = [
              platform
              for platform in ("windows-x86_64-nsis", "windows-aarch64-nsis", "windows-x86_64-msi")
              if platform not in platforms
          ]
          if missing:
              raise SystemExit(f"Missing signed updater artifact(s): {', '.join(missing)}")

          # Compatibility for older updater-enabled builds that did not pass a
          # custom bundle target yet. Keep these pointed at NSIS, which was the
          # original auto-update path before MSI-specific routing was added.
          platforms["windows-x86_64"] = platforms["windows-x86_64-nsis"]
          platforms["windows-aarch64"] = platforms["windows-aarch64-nsis"]

          manifest = {
              "version": version,
              "notes": notes,
              "pub_date": datetime.now(timezone.utc).isoformat().replace("+00:00", "Z"),
              "platforms": platforms,
          }

          Path("latest.json").write_text(
              json.dumps(manifest, indent=2, ensure_ascii=False) + "\n",
              encoding="utf-8",
          )
          PY

      - name: Upload latest.json to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.get-version.outputs.version }}
          draft: true
          prerelease: false
          files: latest.json
          body_path: release-notes.md
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
